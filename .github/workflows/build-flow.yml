name: Build Flow

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# Required by the reusable workflow; its CI jobs reduce this to contents: read.
# Release checkout, tags and GitHub Releases use the built-in GITHUB_TOKEN.
permissions:
  actions: read
  contents: write
  packages: write
  pull-requests: write
  security-events: write

jobs:
  sandbox-containment:
    name: Offline sandbox containment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm install --global bun@1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run build
      # A disposable GitHub VM, never the app host or a Railway deployment.
      # No deployment credentials are passed to the root-only regression.
      - name: Exercise native containment and runaway cleanup
        run: |
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          sudo env ROVE_NATIVE_SANDBOX_TEST=1 /usr/local/bin/node --test dist/test/sandbox-runner.test.js

  build-flow:
    needs: sandbox-containment
    uses: wgtechlabs/build-flow-action/.github/workflows/app.yml@b46ac3e40de838b87e1da6b3e69382982d080916 # v0.2.1
    secrets: inherit
    with:
      ci-profile: node
      ci-runtime-version: "24"
      # Keep Node as the application runtime; install the pinned Bun toolchain.
      ci-setup-command: |
        npm install --global bun@1.3.10
        docker compose up -d --wait postgres redis
      ci-install-command: bun install --frozen-lockfile
      ci-lint-command: |
        bun run check
      ci-typecheck-command: bun run typecheck
      ci-test-command: bun run test
      ci-build-command: bun run build
      ci-docker-smoke-command: |
        docker build -t rove:foundation .
        node scripts/check-container.mjs

      enable-gitleaks: true
      # Private repository: Code Security is not enabled for SARIF uploads.
      enable-codeql: false
      container-upload-sarif: false

      enable-package: false
      enable-container: true
      enable-release: true
      main-branch: main
      dev-branch: dev
      publish-dev-artifacts: false
      publish-pr-artifacts: false
      publish-manual-artifacts: false

      container-registry: both
      # The container action prefixes the repository owner: wgtechlabs/rove.
      container-image-name: rove
      container-pr-comment-enabled: false
      container-vulnerability-comment-enabled: false

      release-initial-version: 0.1.0
      release-commit-convention: clean-commit
      # Recognize Clean Commit's breaking marker before an optional scope.
      release-major-keywords: 'BREAKING CHANGE,BREAKING-CHANGE,breaking,^[^[:alnum:]]*[a-z]+![[:space:]]*(\([^)]+\))?:[[:space:]]'
      release-version-file-paths: package.json
      release-workspace-detection: false
