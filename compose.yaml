services:
  postgres:
    image: ghcr.io/railwayapp-templates/postgres-ssl:18
    environment:
      POSTGRES_USER: rove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rove}
      POSTGRES_DB: rove
      PGDATA: /var/lib/postgresql/data/pgdata
      RAILWAY_VOLUME_MOUNT_PATH: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${ROVE_POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-18-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rove -d rove"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8.2-alpine
    command:
      - /bin/sh
      - -ec
      - |
        case "$$REDISCLI_AUTH" in
          *[!a-zA-Z0-9._~-]*)
            echo "REDIS_PASSWORD must use only letters, numbers, '.', '_', '~' or '-'." >&2
            exit 1
            ;;
        esac
        exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDISCLI_AUTH"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-rove}
    ports:
      - "127.0.0.1:${ROVE_REDIS_PORT:-6389}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  rove:
    build: .
    profiles: [app]
    environment:
      ROVE_URL: ${ROVE_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      ROVE_SETUP_SECRET: ${ROVE_SETUP_SECRET:-}
      DATABASE_URL: postgres://rove:${POSTGRES_PASSWORD:-rove}@postgres:5432/rove
      REDIS_URL: redis://:${REDIS_PASSWORD:-rove}@redis:6379
      ROVE_STATE_KEY_PREFIX: ${ROVE_STATE_KEY_PREFIX:-rove}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres-18-data:
  redis-data:
